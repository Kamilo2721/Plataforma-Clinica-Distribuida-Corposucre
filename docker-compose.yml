version: '3.8'

services:
  # Nodo Sincelejo
  fhir-sincelejo:
    image: hapifhir/hapi-fhir-jpaserver-starter:latest
    ports:
      - "8083:8080"
    environment:
      - hapi.fhir.fhir_version=R4
    restart: always

  # Nodo Bogotá
  fhir-bogota:
    image: hapifhir/hapi-fhir-jpaserver-starter:latest
    ports:
      - "8084:8080"
    environment:
      - hapi.fhir.fhir_version=R4
    restart: always

  # Nodo Medellín
  fhir-medellin:
    image: hapifhir/hapi-fhir-jpaserver-starter:latest
    ports:
      - "8085:8080"
    environment:
      - hapi.fhir.fhir_version=R4
    restart: always
